<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Espacios &amp; Condiciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #eef0ea;
    --surface: #ffffff;
    --surface-2: #f5f6f1;
    --ink: #1b241f;
    --ink-soft: #57625a;
    --ink-faint: #8b958c;
    --border: #d7dbcf;
    --border-strong: #b9c0b2;
    --accent: #b3791f;
    --accent-ink: #ffffff;
    --accent-soft: #f2e4c9;
    --vigente: #3e7a5e;
    --vigente-bg: #e4f0e8;
    --porvencer: #b3791f;
    --porvencer-bg: #f4e9d3;
    --vencido: #ab4432;
    --vencido-bg: #f4e0da;
    --shadow: 0 1px 2px rgba(27,36,31,0.06), 0 6px 20px rgba(27,36,31,0.06);
    --radius: 10px;
    --font-display: 'Space Grotesk', Arial, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171b18;
      --surface: #202521;
      --surface-2: #262b26;
      --ink: #eceee9;
      --ink-soft: #a9b0a6;
      --ink-faint: #737d72;
      --border: #343b34;
      --border-strong: #454d44;
      --accent: #d9a23f;
      --accent-ink: #1b1508;
      --accent-soft: #3a3220;
      --vigente: #6cbb92;
      --vigente-bg: #223129;
      --porvencer: #d9a23f;
      --porvencer-bg: #3a3220;
      --vencido: #e08672;
      --vencido-bg: #3a2521;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #171b18;
    --surface: #202521;
    --surface-2: #262b26;
    --ink: #eceee9;
    --ink-soft: #a9b0a6;
    --ink-faint: #737d72;
    --border: #343b34;
    --border-strong: #454d44;
    --accent: #d9a23f;
    --accent-ink: #1b1508;
    --accent-soft: #3a3220;
    --vigente: #6cbb92;
    --vigente-bg: #223129;
    --porvencer: #d9a23f;
    --porvencer-bg: #3a3220;
    --vencido: #e08672;
    --vencido-bg: #3a2521;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.5;
  }
  input, textarea, select, button { font-family: inherit; font-size: inherit; color: inherit; }

  .app {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Topbar ---------- */
  .shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand-mark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.01em;
  }
  .brand-sub {
    color: var(--ink-faint);
    font-size: 12.5px;
  }
  .role-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .role-pill.editor {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .role-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }

  /* ---------- Body layout ---------- */
  .body-layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  .sidebar {
    width: 320px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }
  .sidebar-head {
    padding: 16px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .search-wrap {
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 9px 12px 9px 32px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface-2);
    outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--ink-faint);
    pointer-events: none;
  }
  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    padding: 10px 14px;
    font-weight: 600;
    font-size: 13.5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--ink);
  }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger {
    background: transparent;
    border: 1px solid var(--vencido);
    color: var(--vencido);
  }
  .btn-danger:hover { background: var(--vencido-bg); }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .client-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .client-row {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2px;
  }
  .client-row:hover { background: var(--surface-2); }
  .client-row.active {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .status-dot.vigente { background: var(--vigente); }
  .status-dot.porvencer { background: var(--porvencer); }
  .status-dot.vencido { background: var(--vencido); }
  .status-dot.indef { background: var(--ink-faint); }
  .client-row-text { min-width: 0; flex: 1; }
  .client-row-name {
    font-weight: 600;
    font-size: 13.8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .client-row-meta {
    font-size: 11.8px;
    color: var(--ink-faint);
    margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .empty-list {
    padding: 30px 16px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 13px;
  }

  /* ---------- Main panel ---------- */
  .main {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 28px 36px 60px;
  }
  .main-inner { max-width: 760px; margin: 0 auto; }

  .empty-state {
    max-width: 420px;
    margin: 80px auto 0;
    text-align: center;
    color: var(--ink-faint);
  }
  .empty-state .glyph {
    font-family: var(--font-display);
    font-size: 40px;
    color: var(--border-strong);
    margin-bottom: 10px;
  }
  .empty-state h2 {
    font-family: var(--font-display);
    font-size: 17px;
    color: var(--ink-soft);
    margin: 0 0 6px;
    font-weight: 600;
  }
  .empty-state p { margin: 0; font-size: 13.5px; }

  .detail-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }
  .detail-title {
    font-family: var(--font-display);
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .detail-title input {
    font-family: var(--font-display);
    font-size: 25px;
    font-weight: 700;
    border: none;
    border-bottom: 2px solid var(--accent);
    background: transparent;
    padding: 0 0 2px;
    width: 100%;
    outline: none;
  }
  .head-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-badge.vigente { color: var(--vigente); background: var(--vigente-bg); }
  .status-badge.porvencer { color: var(--porvencer); background: var(--porvencer-bg); }
  .status-badge.vencido { color: var(--vencido); background: var(--vencido-bg); }
  .status-badge.indef { color: var(--ink-soft); background: var(--surface-2); }

  .field-row { display: flex; gap: 20px; margin-bottom: 18px; flex-wrap: wrap; }
  .field {
    flex: 1;
    min-width: 160px;
  }
  .field label {
    display: block;
    font-size: 11.5px;
    text-transform: none;
    color: var(--ink-faint);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .field .value {
    font-size: 14.5px;
    font-weight: 500;
  }
  .field input[type="date"],
  .field input[type="text"],
  .field textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    background: var(--surface);
    outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }

  .section-label {
    font-family: var(--font-display);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 28px 0 12px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  .espacios-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  @media (max-width: 620px) {
    .espacios-grid { grid-template-columns: 1fr; }
  }
  .espacio-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 12px 13px;
    position: relative;
    overflow: hidden;
  }
  .espacio-card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--border-strong);
  }
  .espacio-card.on::before { background: var(--vigente); }
  .espacio-card.on { border-color: var(--vigente); background: var(--vigente-bg); }
  .espacio-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .espacio-name { font-weight: 600; font-size: 13.5px; }
  .espacio-toggle {
    position: relative;
    width: 36px; height: 20px;
    border-radius: 999px;
    background: var(--border-strong);
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }
  .espacio-toggle.on { background: var(--vigente); }
  .espacio-toggle .knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.15s ease;
  }
  .espacio-toggle.on .knob { transform: translateX(16px); }
  .espacio-detail {
    margin-top: 8px;
    font-size: 12.8px;
    color: var(--ink-soft);
  }
  .espacio-detail input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--surface);
    outline: none;
    font-size: 12.8px;
  }
  .espacio-detail input:focus { border-color: var(--accent); }
  .espacio-card:not(.on) .espacio-name { color: var(--ink-faint); }
  .espacio-badge-off {
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  .notes-block {
    white-space: pre-wrap;
    font-size: 13.8px;
    color: var(--ink);
    background: var(--surface-2);
    border-radius: 8px;
    padding: 12px 14px;
    min-height: 20px;
  }
  .notes-block:empty::before {
    content: "Sin notas.";
    color: var(--ink-faint);
  }
  .field textarea { min-height: 80px; resize: vertical; }

  .updated-note {
    margin-top: 26px;
    font-size: 11.8px;
    color: var(--ink-faint);
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 780px) {
    .body-layout { flex-direction: column; }
    .sidebar { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    .main { padding: 20px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <span class="brand-mark">Espacios &amp; Condiciones</span>
        <span class="brand-sub">acuerdos por cliente</span>
      </div>
      <div id="rolePill" class="role-pill">
        <span class="role-dot"></span>
        <span id="roleText">Verificando acceso…</span>
      </div>
    </div>

    <div class="body-layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="search-wrap">
            <span class="search-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input id="searchInput" type="text" placeholder="Buscar cliente…" autocomplete="off" />
          </div>
          <button id="newClientBtn" class="btn btn-primary btn-block" style="display:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nuevo cliente
          </button>
        </div>
        <div id="clientList" class="client-list"></div>
      </aside>

      <main class="main">
        <div class="main-inner" id="mainInner">
          <div class="empty-state">
            <div class="glyph">⤢</div>
            <h2>Elegí un cliente</h2>
            <p>Seleccioná un cliente de la lista para ver sus condiciones y los espacios acordados, o buscá por nombre.</p>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  "use strict";

  var ESPACIOS = [
    { key: "mostrador", label: "Mostrador" },
    { key: "cajas", label: "En cajas" },
    { key: "frenteCajas", label: "Frente de cajas" },
    { key: "exhibidorBeldent", label: "Exhibidor Beldent" },
    { key: "exhibidorHalls", label: "Exhibidor Halls" },
    { key: "exhibidorAlfajores", label: "Exhibidor de alfajores" },
    { key: "exhibidorChocolate", label: "Exhibidor de chocolate" },
    { key: "exhibidorJugos", label: "Exhibidor de jugos" },
    { key: "primariaGalletas", label: "Primaria de galletas" },
    { key: "primariaDry", label: "Primaria de dry" },
    { key: "primariaJugos", label: "Primaria de jugos" },
    { key: "primariaAlfajores", label: "Primaria de alfajores" },
    { key: "cabeceras", label: "Cabeceras" },
    { key: "adicionales", label: "Adicionales" },
    { key: "botaderos", label: "Botaderos" }
  ];

  var state = {
    db: null,
    canEdit: false,
    clients: [],
    selectedId: null,
    editing: false,          // editing existing client
    creating: false,         // drafting a brand-new client
    draft: null,             // working copy while editing/creating
    search: ""
  };

  var els = {
    roleText: document.getElementById("roleText"),
    rolePill: document.getElementById("rolePill"),
    newClientBtn: document.getElementById("newClientBtn"),
    clientList: document.getElementById("clientList"),
    mainInner: document.getElementById("mainInner"),
    searchInput: document.getElementById("searchInput"),
    toast: document.getElementById("toast")
  };

  function emptyEspacios() {
    var out = {};
    ESPACIOS.forEach(function (e) { out[e.key] = { activo: false, detalle: "" }; });
    return out;
  }

  function blankClient() {
    return {
      nombre: "",
      vigenciaInicio: "",
      vigenciaFin: "",
      espacios: emptyEspacios(),
      notas: ""
    };
  }

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () {
      els.toast.classList.remove("show");
    }, 2200);
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    var parts = iso.split("-");
    if (parts.length !== 3) return iso;
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return d.toLocaleDateString("es-UY", { day: "2-digit", month: "short", year: "numeric" });
  }

  function vigenciaStatus(fin) {
    if (!fin) return { key: "indef", label: "Sin vencimiento" };
    var today = new Date();
    today.setHours(0,0,0,0);
    var f = new Date(fin + "T00:00:00");
    var diffDays = Math.round((f - today) / 86400000);
    if (diffDays < 0) return { key: "vencido", label: "Vencido" };
    if (diffDays <= 30) return { key: "porvencer", label: "Vence en " + diffDays + " día" + (diffDays === 1 ? "" : "s") };
    return { key: "vigente", label: "Vigente" };
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------------- rendering: sidebar ----------------

  function renderList() {
    var q = state.search.trim().toLowerCase();
    var items = state.clients.filter(function (c) {
      return !q || (c.nombre || "").toLowerCase().indexOf(q) !== -1;
    });

    if (!state.clients.length) {
      els.clientList.innerHTML = '<div class="empty-list">' +
        (state.canEdit
          ? 'Todavía no cargaste ningún cliente. Usá "Nuevo cliente" para empezar.'
          : 'Todavía no hay clientes cargados.') +
        '</div>';
      return;
    }
    if (!items.length) {
      els.clientList.innerHTML = '<div class="empty-list">Sin resultados para "' + escapeHtml(state.search) + '".</div>';
      return;
    }

    items.sort(function (a, b) { return (a.nombre || "").localeCompare(b.nombre || "", "es"); });

    els.clientList.innerHTML = items.map(function (c) {
      var st = vigenciaStatus(c.vigenciaFin);
      var activos = ESPACIOS.filter(function (e) { return c.espacios && c.espacios[e.key] && c.espacios[e.key].activo; }).length;
      return '<button class="client-row' + (c.id === state.selectedId ? " active" : "") + '" data-id="' + c.id + '">' +
        '<span class="status-dot ' + st.key + '"></span>' +
        '<span class="client-row-text">' +
          '<span class="client-row-name">' + escapeHtml(c.nombre || "Sin nombre") + '</span>' +
          '<span class="client-row-meta">' + activos + ' espacio' + (activos === 1 ? "" : "s") + ' acordado' + (activos === 1 ? "" : "s") + '</span>' +
        '</span>' +
      '</button>';
    }).join("");

    Array.prototype.forEach.call(els.clientList.querySelectorAll(".client-row"), function (btn) {
      btn.addEventListener("click", function () {
        state.editing = false;
        state.creating = false;
        state.draft = null;
        state.selectedId = btn.getAttribute("data-id");
        render();
      });
    });
  }

  // ---------------- rendering: main panel ----------------

  function render() {
    renderList();

    if (state.creating) {
      renderForm(state.draft, true);
      return;
    }

    var client = state.clients.find(function (c) { return c.id === state.selectedId; });
    if (!client) {
      els.mainInner.innerHTML =
        '<div class="empty-state">' +
          '<div class="glyph">⤢</div>' +
          '<h2>Elegí un cliente</h2>' +
          '<p>Seleccioná un cliente de la lista para ver sus condiciones y los espacios acordados, o buscá por nombre.</p>' +
        '</div>';
      return;
    }

    if (state.editing) {
      renderForm(state.draft, false);
    } else {
      renderView(client);
    }
  }

  function renderView(c) {
    var st = vigenciaStatus(c.vigenciaFin);
    var actionsHtml = state.canEdit
      ? '<div class="head-actions">' +
          '<button class="btn btn-ghost" id="editBtn">Editar</button>' +
          '<button class="btn btn-danger" id="deleteBtn">Eliminar</button>' +
        '</div>'
      : '';

    var espaciosHtml = ESPACIOS.map(function (e) {
      var d = (c.espacios && c.espacios[e.key]) || { activo: false, detalle: "" };
      return '<div class="espacio-card' + (d.activo ? " on" : "") + '">' +
        '<div class="espacio-row">' +
          '<span class="espacio-name">' + e.label + '</span>' +
          (d.activo ? '' : '<span class="espacio-badge-off">No incluido</span>') +
        '</div>' +
        (d.activo && d.detalle ? '<div class="espacio-detail">' + escapeHtml(d.detalle) + '</div>' : '') +
      '</div>';
    }).join("");

    var updatedHtml = c.updatedAt
      ? '<div class="updated-note">Última actualización: ' + new Date(c.updatedAt).toLocaleString("es-UY") + '</div>'
      : '';

    els.mainInner.innerHTML =
      '<div class="detail-head">' +
        '<div>' +
          '<h1 class="detail-title">' + escapeHtml(c.nombre || "Sin nombre") + '</h1>' +
          '<span class="status-badge ' + st.key + '">' + st.label + '</span>' +
        '</div>' +
        actionsHtml +
      '</div>' +

      '<div class="field-row">' +
        '<div class="field"><label>Inicio del acuerdo</label><div class="value">' + fmtDate(c.vigenciaInicio) + '</div></div>' +
        '<div class="field"><label>Fin del acuerdo</label><div class="value">' + fmtDate(c.vigenciaFin) + '</div></div>' +
      '</div>' +

      '<div class="section-label">Espacios acordados</div>' +
      '<div class="espacios-grid">' + espaciosHtml + '</div>' +

      '<div class="section-label">Notas</div>' +
      '<div class="notes-block">' + escapeHtml(c.notas || "") + '</div>' +

      updatedHtml;

    if (state.canEdit) {
      document.getElementById("editBtn").addEventListener("click", function () {
        state.editing = true;
        state.draft = JSON.parse(JSON.stringify(c));
        render();
      });
      document.getElementById("deleteBtn").addEventListener("click", function () {
        if (confirm('¿Eliminar a "' + (c.nombre || "este cliente") + '"? Esta acción no se puede deshacer.')) {
          deleteClient(c.id);
        }
      });
    }
  }

  function renderForm(draft, isNew) {
    var espaciosHtml = ESPACIOS.map(function (e) {
      var d = draft.espacios[e.key] || { activo: false, detalle: "" };
      return '<div class="espacio-card' + (d.activo ? " on" : "") + '" data-key="' + e.key + '">' +
        '<div class="espacio-row">' +
          '<span class="espacio-name">' + e.label + '</span>' +
          '<button type="button" class="espacio-toggle' + (d.activo ? " on" : "") + '" data-key="' + e.key + '"><span class="knob"></span></button>' +
        '</div>' +
        '<div class="espacio-detail" style="' + (d.activo ? "" : "display:none;") + '">' +
          '<input type="text" data-detail-key="' + e.key + '" placeholder="Detalle (ej: 3 posiciones, cambio mensual…)" value="' + escapeHtml(d.detalle) + '" />' +
        '</div>' +
      '</div>';
    }).join("");

    els.mainInner.innerHTML =
      '<div class="detail-head">' +
        '<div style="flex:1;">' +
          '<h1 class="detail-title"><input type="text" id="nombreInput" placeholder="Nombre del cliente" value="' + escapeHtml(draft.nombre) + '" /></h1>' +
        '</div>' +
      '</div>' +

      '<div class="field-row">' +
        '<div class="field"><label>Inicio del acuerdo</label><input type="date" id="inicioInput" value="' + (draft.vigenciaInicio || "") + '" /></div>' +
        '<div class="field"><label>Fin del acuerdo</label><input type="date" id="finInput" value="' + (draft.vigenciaFin || "") + '" /></div>' +
      '</div>' +

      '<div class="section-label">Espacios acordados</div>' +
      '<div class="espacios-grid">' + espaciosHtml + '</div>' +

      '<div class="section-label">Notas</div>' +
      '<div class="field"><textarea id="notasInput" placeholder="Notas adicionales del acuerdo…">' + escapeHtml(draft.notas || "") + '</textarea></div>' +

      '<div class="form-actions">' +
        '<button class="btn btn-primary" id="saveBtn">Guardar</button>' +
        '<button class="btn btn-ghost" id="cancelBtn">Cancelar</button>' +
      '</div>';

    document.getElementById("nombreInput").addEventListener("input", function (e) { draft.nombre = e.target.value; });
    document.getElementById("inicioInput").addEventListener("input", function (e) { draft.vigenciaInicio = e.target.value; });
    document.getElementById("finInput").addEventListener("input", function (e) { draft.vigenciaFin = e.target.value; });
    document.getElementById("notasInput").addEventListener("input", function (e) { draft.notas = e.target.value; });

    Array.prototype.forEach.call(els.mainInner.querySelectorAll(".espacio-toggle"), function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-key");
        draft.espacios[key].activo = !draft.espacios[key].activo;
        renderForm(draft, isNew);
      });
    });
    Array.prototype.forEach.call(els.mainInner.querySelectorAll("[data-detail-key]"), function (input) {
      input.addEventListener("input", function () {
        draft.espacios[input.getAttribute("data-detail-key")].detalle = input.value;
      });
    });

    document.getElementById("saveBtn").addEventListener("click", function () { saveDraft(isNew); });
    document.getElementById("cancelBtn").addEventListener("click", function () {
      state.editing = false;
      state.creating = false;
      state.draft = null;
      render();
    });
  }

  // ---------------- persistence ----------------

  function saveDraft(isNew) {
    if (!state.db) return;
    var draft = state.draft;
    if (!draft.nombre || !draft.nombre.trim()) {
      showToast("Ingresá el nombre del cliente para guardar.");
      return;
    }
    var payload = {
      nombre: draft.nombre.trim(),
      vigenciaInicio: draft.vigenciaInicio || "",
      vigenciaFin: draft.vigenciaFin || "",
      espacios: draft.espacios,
      notas: draft.notas || "",
      updatedAt: Date.now()
    };

    var p;
    if (isNew) {
      p = state.db.collection("clientes").add(payload).then(function (ref) {
        state.selectedId = ref.id;
      });
    } else {
      p = state.db.doc("clientes/" + state.selectedId).update(payload);
    }

    p.then(function () {
      state.editing = false;
      state.creating = false;
      state.draft = null;
      showToast("Guardado.");
      render();
    }).catch(function (err) {
      console.error(err);
      showToast("No se pudo guardar. " + (err && err.code === "invalid_argument" ? "Verificá los datos." : "Intentá de nuevo."));
    });
  }

  function deleteClient(id) {
    if (!state.db) return;
    state.db.doc("clientes/" + id).delete().then(function () {
      if (state.selectedId === id) state.selectedId = null;
      showToast("Cliente eliminado.");
      render();
    }).catch(function (err) {
      console.error(err);
      showToast("No se pudo eliminar.");
    });
  }

  // ---------------- init ----------------

  els.searchInput.addEventListener("input", function (e) {
    state.search = e.target.value;
    renderList();
  });

  els.newClientBtn.addEventListener("click", function () {
    state.selectedId = null;
    state.editing = false;
    state.creating = true;
    state.draft = blankClient();
    render();
  });

  // ============================================================
  // CONFIGURÁ ACÁ TU PROYECTO DE FIREBASE
  // (Firebase Console → Configuración del proyecto → Tus apps → Config)
  // ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyA-EvMk2FppfdTII51UJrfVkt33INTkLJQ",
  authDomain: "distrishop-acuerdo.firebaseapp.com",
  projectId: "distrishop-acuerdo",
  storageBucket: "distrishop-acuerdo.firebasestorage.app",
  messagingSenderId: "654695071396",
  appId: "1:654695071396:web:4e5278c013994afb9a3031",
  measurementId: "G-9CS03TDP1C"
};


  // Clave para poder editar/cargar clientes. Cambiala por la tuya.
  // Cualquiera que la conozca puede editar: usala solo como filtro básico
  // para tu equipo, no como seguridad real.
  var EDIT_PASSCODE = "hernan1891";
  // ============================================================

  function setRole(canEdit) {
    state.canEdit = canEdit;
    els.newClientBtn.style.display = canEdit ? "" : "none";
    els.rolePill.classList.toggle("editor", canEdit);
    els.roleText.textContent = canEdit ? "Podés editar" : "Solo lectura";
    els.rolePill.style.cursor = "pointer";
  }

  function tryUnlockEdit() {
    var pass = prompt("Ingresá la clave para poder cargar/editar clientes:");
    if (pass === null) return;
    if (pass === EDIT_PASSCODE) {
      sessionStorage.setItem("puedeEditar", "1");
      setRole(true);
      showToast("Modo edición activado.");
    } else {
      showToast("Clave incorrecta.");
    }
  }

  async function init() {
    els.rolePill.addEventListener("click", function () {
      if (!state.canEdit) tryUnlockEdit();
    });

    var yaDesbloqueado = sessionStorage.getItem("puedeEditar") === "1";
    setRole(yaDesbloqueado);

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    var db = firebase.firestore();
    state.db = db;

    db.collection("clientes").onSnapshot(function (snap) {
      state.clients = snap.docs.map(function (d) {
        var data = d.data();
        var esp = emptyEspacios();
        if (data.espacios) {
          Object.keys(esp).forEach(function (k) {
            if (data.espacios[k]) esp[k] = { activo: !!data.espacios[k].activo, detalle: data.espacios[k].detalle || "" };
          });
        }
        return {
          id: d.id,
          nombre: data.nombre || "",
          vigenciaInicio: data.vigenciaInicio || "",
          vigenciaFin: data.vigenciaFin || "",
          espacios: esp,
          notas: data.notas || "",
          updatedAt: data.updatedAt || null
        };
      });
      render();
    }, function (err) {
      console.error(err);
      showToast("No se pudieron cargar los clientes.");
    });

    render();
  }

  init();
})();
</script>
