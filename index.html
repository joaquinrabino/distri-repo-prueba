  /* ========================================================
     CLAVE EDICIÓN
  ======================================================== */

  var EDIT_PASSCODE =
    "hernan1891";



  function setRole(
    canEdit
  ) {

    state.canEdit =
      canEdit;


    els.newClientBtn.style.display =

      canEdit
        ? ""
        : "none";


    els.rolePill.classList.toggle(
      "editor",
      canEdit
    );


    els.roleText.textContent =

      canEdit
        ? "Podés editar"
        : "Solo lectura";


    els.rolePill.style.cursor =
      "pointer";

  }



  function tryUnlockEdit() {

    var pass =
      prompt(
        "Ingresá la clave para poder cargar/editar clientes:"
      );


    if (
      pass === null
    ) {

      return;

    }



    if (
      pass === EDIT_PASSCODE
    ) {

      sessionStorage.setItem(
        "puedeEditar",
        "1"
      );


      setRole(
        true
      );


      showToast(
        "Modo edición activado."
      );

    } else {

      showToast(
        "Clave incorrecta."
      );

    }

  }



  /* ========================================================
     INIT
  ======================================================== */

  async function init() {

    els.rolePill
      .addEventListener(
        "click",
        function () {

          if (
            !state.canEdit
          ) {

            tryUnlockEdit();

          }

        }
      );



    var yaDesbloqueado =

      sessionStorage.getItem(
        "puedeEditar"
      ) === "1";



    setRole(
      yaDesbloqueado
    );



    if (
      !firebase.apps.length
    ) {

      firebase.initializeApp(
        firebaseConfig
      );

    }



    var db =
      firebase.firestore();



    state.db =
      db;



    state.storage =
      firebase.storage();



    db.collection(
      "clientes"
    )

    .onSnapshot(

      function (snap) {

        state.clients =

          snap.docs.map(
            function (doc) {

              var data =
                doc.data();


              var esp =
                emptyEspacios();



              if (
                data.espacios
              ) {

                Object.keys(
                  esp
                ).forEach(
                  function (k) {

                    if (
                      data.espacios[k]
                    ) {

                      esp[k] = {

                        activo:
                          !!data
                            .espacios[k]
                            .activo,

                        detalle:
                          data
                            .espacios[k]
                            .detalle ||
                          "",

                        fotoUrl:
                          data
                            .espacios[k]
                            .fotoUrl ||
                          "",

                        fotoPath:
                          data
                            .espacios[k]
                            .fotoPath ||
                          ""

                      };

                    }

                  }
                );

              }



              return {

                id:
                  doc.id,

                nombre:
                  data.nombre ||
                  "",

                vigenciaInicio:
                  data.vigenciaInicio ||
                  "",

                vigenciaFin:
                  data.vigenciaFin ||
                  "",

                espacios:
                  esp,

                notas:
                  data.notas ||
                  "",

                updatedAt:
                  data.updatedAt ||
                  null

              };

            }
          );


        render();

      },

      function (err) {

        console.error(
          err
        );


        showToast(
          "No se pudieron cargar los clientes."
        );

      }

    );



    render();

  }



  init();


})();

</script>
